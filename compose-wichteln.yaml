include:
  - compose.yaml

services:
  backend:
    image: wichteln-backend
    build: ./backend/
    hostname: backend.wichteln.local
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      - ~/docker_data/wichteln/config.json:/app/config.json:ro
    depends_on:
      db:
        condition: service_healthy
    # Only needed if your reverse proxy talks to the backend directly –
    # the frontend container already proxies /api to it.
    ports:
      - 3000:3000

  frontend:
    image: wichteln-frontend
    build: ./frontend/
    hostname: frontend.wichteln.local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 5173:80
