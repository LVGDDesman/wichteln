include:
  - compose.yaml

services:
  backend:
    image: wichteln-backend
    build: ./backend/
    hostname: backend.wichteln.local
    volumes:
      - ~/docker_data/wichteln/config.json:/home/node/backend/src/config.json:ro
    restart: always
    depends_on:
      - db

  frontend:
    image: wichteln-frontend
    build: ./frontend/
    hostname: frontend.wichteln.local
    restart: always

  proxy:
    image: nginx:1.27-alpine
    hostname: proxy.wichteln.local
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 80:80
