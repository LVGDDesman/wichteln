name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wichteln
          MARIADB_USER: wichteln
          MARIADB_PASSWORD: wichteln
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Write test config
        run: |
          cat > config.test.json <<'EOF'
          {
            "db": { "host": "127.0.0.1", "user": "wichteln", "password": "wichteln", "database": "wichteln" },
            "jwt": { "secret": "ci-secret-ci-secret-ci-secret-ci-secret" },
            "mail": { "host": "localhost", "port": 2525, "tls": false, "user": "ci@example.org", "password": "x", "username": "CI" },
            "wichteln": { "enddate": "2099-12-10T00:00:00Z" }
          }
          EOF
      - run: npm test
        env:
          INTEGRATION: "1"
          CONFIG_PATH: ./config.test.json
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
