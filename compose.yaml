services:
  db:
    image: mariadb:11
    hostname: mariadb.local
    restart: unless-stopped
    env_file: ~/docker_data/wichteln/mariadb.env
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mariadb_data:
