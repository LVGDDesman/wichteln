services:
  db:
    image: mariadb
    hostname: mariadb.local
    restart: always
    env_file: ~/docker_data/wichteln/mariadb.env
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    image: wichteln-backend
    build: ./backend/
    hostname: backend.wichteln.local
    volumes:
      - ~/docker_data/wichteln/config.json:/home/node/backend/src/config.json:ro
    restart: always
    depends_on:
      - db

  frontend:
    image: wichteln-frontend
    build: ./frontend/
    hostname: frontend.wichteln.local
    restart: always

  proxy:
    image: nginx:1.27-alpine
    hostname: proxy.wichteln.local
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - 5173:80

volumes:
  mariadb_data:
