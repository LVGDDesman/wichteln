services:
  db:
    image: mariadb
    hostname: mariadb.local
    restart: always
    env_file: ~/docker_data/wichteln/mariadb.env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - wichteln

  backend:
    image: wichteln-backend
    build: ./backend/
    hostname: backend.wichteln.local
    volumes:
      - ~/docker_data/wichteln/config.json:/home/node/backend/src/config.json:ro
    restart: always
    depends_on:
      - db
    networks:
      - wichteln

  frontend:
    image: wichteln-frontend
    build: ./frontend/
    hostname: frontend.wichteln.local
    restart: always
    networks:
      - wichteln

  proxy:
    image: nginx:1.27-alpine
    hostname: wichteln.local
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      - backend
      - frontend
    networks:
      - public
      - wichteln

volumes:
  mariadb_data:
networks:
  public:
    external: true
  wichteln:
