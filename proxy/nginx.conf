server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Variables in proxy_pass are resolved per request and need a resolver:
    # 127.0.0.11 is Docker's internal DNS. This way nginx starts even if
    # backend/frontend are down and picks up new container IPs after restarts.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:3000;
    set $frontend http://frontend:80;

    location /api/ {
        proxy_pass $backend;
    }

    location / {
        proxy_pass $frontend;
    }
}
