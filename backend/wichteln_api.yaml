openapi: "3.0.3"
info:
  title: Wichteln API
  version: "2.0"
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  /api/user/create:
    post:
      summary: Register and log in at the same time
      tags: [User]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/user/authenticate:
    post:
      summary: Log in with username or email
      tags: [User]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/user/reset:
    post:
      summary: Mail a new password to the given address (if it exists)
      tags: [User]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 255 }
      responses:
        "204": { description: Request accepted }
        "400": { $ref: "#/components/responses/Error" }

  /api/user:
    get:
      summary: Get own user
      tags: [User]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update own user – omitted fields stay unchanged
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete own user (only before the draw)
      tags: [User]
      responses:
        "204": { description: User deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/wichtel/status:
    get:
      summary: End date and whether the draw already happened
      tags: [Wichtel]
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Error" }

  /api/wichtel:
    get:
      summary: Get own wish and address
      tags: [Wichtel]
      responses:
        "200":
          description: Own wichtel data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WichtelData" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Set own wish and/or address (only before the end date)
      tags: [Wichtel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WichtelData" }
      responses:
        "200":
          description: Stored wichtel data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WichtelData" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/wichtel/wichtelee:
    get:
      summary: Get the person you are gifting
      tags: [Wichtel]
      responses:
        "200":
          description: Your wichtelee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wichtelee" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/wichtel/end:
    post:
      summary: Run the draw manually (otherwise it runs automatically at the end date)
      tags: [Wichtel]
      responses:
        "204": { description: Drawn }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Username:
      type: string
      minLength: 2
      maxLength: 64
      pattern: "^\\S(.*\\S)?$"
    Email:
      type: string
      format: email
      maxLength: 255
    Password:
      type: string
      minLength: 6
      maxLength: 128

    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username: { $ref: "#/components/schemas/Username" }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 255, description: Username or email }
        password: { type: string, minLength: 1, maxLength: 128 }

    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        username: { $ref: "#/components/schemas/Username" }
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }

    User:
      type: object
      required: [username, email]
      properties:
        username: { type: string }
        email: { type: string }

    Session:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [token]
          properties:
            token: { type: string }

    Status:
      type: object
      required: [enddate, over, drawn]
      properties:
        enddate: { type: string, format: date-time, example: "2026-12-10T00:00:00.000Z" }
        over: { type: boolean, description: End date has passed }
        drawn: { type: boolean, description: Wichtelees have been assigned }

    WichtelData:
      type: object
      additionalProperties: false
      properties:
        wish: { type: string, nullable: true, maxLength: 2000 }
        address: { type: string, nullable: true, maxLength: 500 }

    Wichtelee:
      type: object
      required: [username]
      properties:
        username: { type: string }
        wish: { type: string, nullable: true }
        address: { type: string, nullable: true }
